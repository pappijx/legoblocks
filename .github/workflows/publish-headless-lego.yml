name: Publish headless-lego

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'headless-lego-v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build headless-lego
        working-directory: libs/headless-lego
        run: npx nx build headless-lego

      - name: Publish headless-lego
        working-directory: libs/headless-lego
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
